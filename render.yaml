# REVIEW TEMPLATE: applying this Blueprint creates billable resources. No deployment has been performed.
# Secrets use service-level sync:false; Render ignores sync:false in environment groups.
# Migrate with a separately credentialed release job. Jev credentials belong only to the worker.
services:
  - type: web
    name: agent-quality-web
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    healthCheckPath: /
    autoDeployTrigger: 'off'
    envVars:
      - key: SERVICE_ROLE
        value: 'web'
      - key: PORT
        value: '10000'
      - key: API_ORIGIN
        sync: false
  - type: web
    name: agent-quality-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    numInstances: 2
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: 'off'
    envVars:
      - key: SERVICE_ROLE
        value: 'api'
      - fromGroup: agent-quality-server-defaults
      - key: PORT
        value: '10000'
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: KMS_KEY_ID
        sync: false
      - key: DELETION_JOURNAL_HMAC_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DELETION_JOURNAL_BUCKET
        sync: false
      - key: BACKUP_KMS_KEY_ID
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      - key: DODO_PAYMENTS_ENVIRONMENT
        sync: false
      - key: DODO_STARTER_PRODUCT_ID
        sync: false
      - key: DODO_TEAM_PRODUCT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
  - type: worker
    name: agent-quality-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: 'off'
    envVars:
      - key: SERVICE_ROLE
        value: 'worker'
      - fromGroup: agent-quality-server-defaults
      - key: PORT
        value: '10000'
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: KMS_KEY_ID
        sync: false
      - key: DELETION_JOURNAL_HMAC_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SEMANTIC_EVALUATIONS_ENABLED
        value: 'false'
      - key: TYPESAFE_API_KEY
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      - key: DODO_PAYMENTS_ENVIRONMENT
        sync: false
      - key: DODO_STARTER_PRODUCT_ID
        sync: false
      - key: DODO_TEAM_PRODUCT_ID
        sync: false
  - type: cron
    name: agent-quality-backup
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    schedule: '0 */6 * * *'
    autoDeployTrigger: 'off'
    envVars:
      - key: SERVICE_ROLE
        value: 'backup'
      - fromGroup: agent-quality-backup-defaults
      - key: BACKUP_DATABASE_URL
        sync: false
      - key: BACKUP_BUCKET
        sync: false
      - key: BACKUP_KMS_KEY_ID
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
envVarGroups:
  - name: agent-quality-server-defaults
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: AWS_REGION
        value: ap-southeast-1
      - key: MONTHLY_BUDGET_USD
        value: '150'
      - key: BUDGET_ALERT_USD
        value: '120'
      - key: CAPACITY_OVER_150_APPROVED
        value: 'false'
      - key: ARCHIVE_BUCKET
        value: agent-quality-private
      - key: SESSION_SECRET
        generateValue: true
  - name: agent-quality-backup-defaults
    envVars:
      - key: NODE_ENV
        value: production
      - key: AWS_REGION
        value: ap-southeast-1
      - key: BACKUP_REGION
        value: ap-southeast-1
      - key: ARCHIVE_BUCKET
        value: agent-quality-private
