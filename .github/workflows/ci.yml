name: Verify
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env: {POSTGRES_DB: agent_quality, POSTGRES_USER: postgres, POSTGRES_PASSWORD: local_postgres_password}
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      MIGRATION_DATABASE_URL: postgresql://postgres:local_postgres_password@localhost:55432/agent_quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run db:migrate && npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:python
      - run: npm run test:integration
      - run: npm run test:regression
      - run: npm run test:commerce
      - run: npm run build
      - run: npm run test:e2e
