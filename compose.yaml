name: agent-quality
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: agent_quality
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_postgres_password
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_quality"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres:
