# Local Supabase services. Application SQL remains in packages/db/migrations.
# Hosted Auth settings are configured separately; do not push localhost redirects.
project_id = "agent-quality"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"

[db.pooler]
enabled = false

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "16MiB"

[storage.buckets.agent-quality-private]
public = false
file_size_limit = "16MiB"
allowed_mime_types = ["application/json"]

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3001"
additional_redirect_urls = ["http://localhost:3000/api/v1/auth/callback", "http://localhost:3001/api/v1/auth/callback", "http://localhost:3002/api/v1/auth/callback", "http://127.0.0.1:3000/api/v1/auth/callback", "http://127.0.0.1:3001/api/v1/auth/callback", "http://127.0.0.1:3002/api/v1/auth/callback"]
jwt_expiry = 3600
signing_keys_path = "./.keys/signing-keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"

[analytics]
enabled = false

[edge_runtime]
enabled = false
